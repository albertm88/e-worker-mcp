[project]
name = "e-worker-mcp"
version = "0.0.0.1"
description = "解决工作琐事的 Python stdio MCP 工具：待办/工时/日报/纪要提取，双模式白黑名单安全裁决"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
